[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipbudget"
version = "0.1.0"
description = "Scorer-induced partial identification of benchmark comparisons"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rajveer Singh Pall" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Frozen verifier stack (G1.3; results/flipbudget/verifier_config.json). Exact pins on purpose:
# a verifier version change is a change of measurement instrument.
verify = [
    "math-verify==0.9.0",
    "latex2sympy2_extended==1.11.0",
    "sympy==1.13.1",
    "antlr4-python3-runtime==4.11.0",
    "pebble==5.1.1",
    "scipy>=1.11",
]

[project.scripts]
flipbudget = "flipbudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
